<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | LIFT4ALL</title><link rel="stylesheet" href="style.css"></head><body><div id="header"></div><main><section class="page-hero"><span class="eyebrow">MIJN LIFT4ALL</span><h1>Account aanmaken of inloggen.</h1><p>Deze demo onthoudt accountgegevens lokaal in uw browser. Voor een echte website is een beveiligde backend nodig.</p></section><section class="section account-grid"><form class="form-card" data-form="account"><h2>Account aanmaken</h2><label>Naam<input required name="naam"></label><label>E-mail<input required type="email" name="email"></label><label>Wachtwoord<input required type="password" name="password"></label><button class="btn primary" type="submit">Account aanmaken</button><div class="form-success"></div></form><form class="form-card" data-form="login"><h2>Inloggen</h2><label>E-mail<input required type="email" name="email"></label><label>Wachtwoord<input required type="password" name="password"></label><button class="btn secondary" type="submit">Inloggen</button><div class="form-success"></div></form></section></main><div id="footer"></div><script src="script.js"></script></body></html>
