<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offerte aanvragen | LIFT4ALL</title><link rel="stylesheet" href="style.css"></head><body><div id="header"></div><main>
<section class="page-hero"><span class="eyebrow">OFFERTE</span><h1>Vraag vrijblijvend een offerte aan.</h1><p>Vertel ons welke lift u zoekt en wat de situatie is. We nemen de aanvraag daarna met u door.</p></section>
<section class="section"><form class="form-card wide" data-form="quote"><div class="form-row"><label>Naam / bedrijfsnaam<input required name="naam" placeholder="Uw naam of bedrijfsnaam"></label><label>E-mail<input required type="email" name="email" placeholder="uw@email.nl"></label></div><div class="form-row"><label>Telefoon<input name="telefoon" placeholder="Uw telefoonnummer"></label><label>Liftsoort<select name="lift"><option>Personenlift</option><option>Rolstoellift</option><option>Platformlift</option><option>Traplift</option><option>Nog niet bepaald</option></select></label></div><label>Type aanvraag<select name="type"><option>Nieuwe lift</option><option>Onderhoud</option><option>Reparatie</option><option>Service per maand</option></select></label><label>Vertel iets over uw situatie<textarea required name="bericht" rows="7" placeholder="Bijvoorbeeld gebouwtype, verdiepingen, gebruik en gewenste planning"></textarea></label><button class="btn primary" type="submit">Offerte aanvragen</button><a class="btn ghost" href="contact.html">Liever eerst contact opnemen</a><div class="form-success"></div></form></section>
</main><div id="footer"></div><script src="script.js"></script></body></html>
